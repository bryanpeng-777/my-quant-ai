name: Portfolio PnL Report Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'portfolio_pnl.py'
      - 'email_report_layout.py'
      - 'purchase_records.json'
      - 'stock_utils.py'

jobs:
  portfolio_pnl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute Portfolio PnL Report
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python portfolio_pnl.py
