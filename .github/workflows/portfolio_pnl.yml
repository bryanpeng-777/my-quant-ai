name: Portfolio PnL Report Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'portfolio_pnl.py'
      - 'email_report_layout.py'
      - 'mother_assets_valuation.py'
      - 'mother_assets_report.py'
      - 'mother_cash_interest.py'
      - 'mother_assets.json'
      - 'purchase_records.json'
      - 'stock_utils.py'

permissions:
  contents: write

jobs:
  portfolio_pnl:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute Portfolio PnL Report
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python portfolio_pnl.py

      - name: Persist latest bogle desires
        run: |
          if git diff --quiet -- purchase_records.json; then
            echo "No bogle desire updates to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add purchase_records.json
          git commit -m "data: 同步最新一期博格买入欲望 [skip ci]"
          git push
